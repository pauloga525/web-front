<app-header></app-header>

<app-breadcrumb></app-breadcrumb>

<!-- Academic Authorities Section -->
<section class="py-20 px-6 bg-slate-50 dark:bg-background-dark">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="text-3xl lg:text-4xl font-black text-slate-900 dark:text-white">Consejo Estudiantil</h2>
      <p class="text-slate-500 dark:text-slate-400 mt-4">Liderazgo estudiantil que representa y promueve el bienestar de nuestra comunidad.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <div 
        *ngFor="let member of councilMembers; let i = index"
        class="group bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer"
        (click)="openDetail(i)"
      >
        <div 
          class="aspect-[4/3] w-full bg-slate-200 dark:bg-slate-700" 
          [style.background-image]="'url(' + member.image + ')'"
          style="background-size: cover; background-position: center top;"
        ></div>
        <div class="p-6">
          <p class="text-primary font-bold text-sm uppercase tracking-wide mb-1">{{ member.title }}</p>
          <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">{{ member.name }}</h3>
          <p class="text-slate-500 dark:text-slate-400 text-sm">{{ member.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
