<app-header></app-header>

<app-breadcrumb></app-breadcrumb>

<!-- Imagen de fondo del hero (opcional, configurable desde el panel admin) -->
<div class="hero-wrapper" *ngIf="heroImagen">
  <img [src]="heroImagen" alt="" class="hero-bg-img" />
</div>

<!-- Academic Authorities Section -->
<section class="py-20 px-6 bg-slate-50 dark:bg-background-dark">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="text-3xl lg:text-4xl font-black text-slate-900 dark:text-white">Consejo Estudiantil</h2>
      <p class="text-slate-500 dark:text-slate-400 mt-4">Liderazgo estudiantil que representa y promueve el bienestar de nuestra comunidad.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <button
        type="button"
        *ngFor="let member of councilMembers; let i = index"
        class="block w-full text-left group bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer"
        (click)="openDetail(i)"
        [attr.aria-label]="'Ver detalle de ' + member.nombre"
      >
        <div
          class="aspect-[4/3] w-full bg-slate-200 dark:bg-slate-700"
          [style.background-image]="'url(' + member.imagen + ')'"
          style="background-size: cover; background-position: center top;"
        ></div>
        <div class="p-6">
          <p class="text-primary font-bold text-sm uppercase tracking-wide mb-1">{{ member.titulo }}</p>
          <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">{{ member.nombre }}</h3>
          <p class="text-slate-500 dark:text-slate-400 text-sm">{{ member.descripcion }}</p>
        </div>
      </button>
      <p *ngIf="!councilMembers.length" class="text-center text-slate-400 dark:text-slate-500 italic py-12 col-span-full">
        Próximamente conocerás a los miembros del Consejo Estudiantil.
      </p>
    </div>
  </div>
</section>

<app-footer></app-footer>
