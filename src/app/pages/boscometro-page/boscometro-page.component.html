<app-header></app-header>
<app-breadcrumb></app-breadcrumb>

<!-- Imagen de fondo del hero (opcional, configurable desde el panel admin) -->
<div class="hero-wrapper" *ngIf="heroImagen">
  <img [src]="heroImagen" alt="" class="hero-bg-img" />
</div>

<div class="page-container">
  <h1 class="page-title">Boscómetro</h1>
  <hr class="page-divider" />

  <!-- Tablas de puntajes -->
  <section class="tablas-section" *ngIf="tablas.length">
    <div class="tabla-block" *ngFor="let t of tablas">
      <h2 class="section-title">{{ t.titulo }}</h2>
      <div class="tabla-scroll">
        <table class="tabla-puntajes">
          <tbody>
            <tr *ngFor="let fila of t.filas" [class.fila-encabezado]="fila.esEncabezado">
              <td *ngFor="let valor of fila.valores">{{ valor }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Gráficos por nivel -->
  <section class="grafico-block" *ngFor="let g of graficos">
    <h2 class="section-title section-title-center">{{ g.titulo }}</h2>
    <div class="grafico-card">
      <p class="grafico-subtitulo" *ngIf="g.descripcion">{{ g.descripcion }}</p>
      <app-bar-chart [datos]="g.datos ?? []"></app-bar-chart>
    </div>
  </section>

  <p class="sin-contenido" *ngIf="!tablas.length && !graficos.length">
    Aún no hay tablas ni gráficos publicados.
  </p>
</div>

<app-footer></app-footer>
