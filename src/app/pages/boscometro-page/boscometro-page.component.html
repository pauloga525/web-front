<app-header></app-header>
<app-breadcrumb></app-breadcrumb>

<!-- Imagen de fondo del hero (opcional, configurable desde el panel admin) -->
<div class="hero-wrapper" *ngIf="heroImagen">
  <img [src]="heroImagen" alt="" class="hero-bg-img" />
</div>

<div class="page-container">
  <h1 class="page-title">Boscómetro</h1>
  <hr class="page-divider" />

  <!-- Secciones: tabla de puntajes seguida de su gráfico -->
  <section class="seccion-block" *ngFor="let s of secciones">
    <div class="tabla-block" *ngIf="s.tabla">
      <h2 class="section-title">{{ s.tabla.titulo }}</h2>
      <div class="tabla-scroll">
        <table class="tabla-puntajes">
          <tbody>
            <tr *ngFor="let fila of s.tabla.filas" [class.fila-encabezado]="fila.esEncabezado">
              <td *ngFor="let valor of fila.valores">{{ valor }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="grafico-block" *ngIf="s.grafico">
      <h2 class="section-title section-title-center">{{ s.grafico.titulo }}</h2>
      <div class="grafico-card">
        <p class="grafico-subtitulo" *ngIf="s.grafico.descripcion">{{ s.grafico.descripcion }}</p>
        <app-bar-chart [datos]="s.grafico.datos ?? []"></app-bar-chart>
      </div>
    </div>
  </section>

  <p class="sin-contenido" *ngIf="!secciones.length">
    Aún no hay tablas ni gráficos publicados.
  </p>
</div>

<app-footer></app-footer>
