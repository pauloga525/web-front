<app-header></app-header>
<app-breadcrumb></app-breadcrumb>

<div class="w-full bg-white dark:bg-slate-900 py-16 px-4">
  <div class="max-w-6xl mx-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-4xl font-bold text-slate-900 dark:text-white">Noticias</h1>
        <p class="text-slate-600 dark:text-slate-300 mt-2">Vista de noticias publicadas</p>
      </div>
      <button
        (click)="goToDashboard()"
        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
        Gestionar en el Dashboard
      </button>
    </div>

    <!-- Info banner -->
    <div class="mb-8 bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-700 rounded-lg p-4 flex items-start gap-3">
      <span class="text-blue-600 dark:text-blue-400 text-xl mt-0.5">ℹ️</span>
      <p class="text-blue-800 dark:text-blue-300 text-sm">
        Para crear, editar o eliminar noticias utiliza el <strong>Panel de Administración</strong>.
        Los cambios se reflejan aquí en tiempo real.
      </p>
    </div>

    <!-- News List -->
    <div *ngIf="newsList.length === 0" class="text-center py-16 text-slate-400">
      No hay noticias publicadas.
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div
        *ngFor="let news of newsList"
        class="bg-white dark:bg-slate-800 rounded-xl shadow overflow-hidden border border-slate-100 dark:border-slate-700">
        <img
          *ngIf="news.featuredImage || news.image"
          [src]="news.featuredImage || news.image"
          [alt]="news.title"
          class="w-full h-40 object-cover">
        <div class="p-4">
          <span class="text-xs font-semibold uppercase text-blue-600 dark:text-blue-400">{{ news.category }}</span>
          <h3 class="text-lg font-bold text-slate-900 dark:text-white mt-1 line-clamp-2">{{ news.title }}</h3>
          <p class="text-slate-500 dark:text-slate-400 text-sm mt-1 line-clamp-2">{{ news.description }}</p>
          <div class="flex items-center justify-between mt-4">
            <span class="text-xs text-slate-400">{{ news.date }}</span>
            <button
              (click)="viewNews(news._id)"
              class="text-sm text-blue-600 hover:underline dark:text-blue-400">
              Ver noticia
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<app-footer></app-footer>
