<div class="bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-xl border border-gray-100 dark:border-gray-700 flex flex-col md:flex-row h-auto md:h-96">
  <!-- Image Section -->
  <a [routerLink]="['/events', event.id]" class="md:w-3/5 h-64 md:h-full relative overflow-hidden group block cursor-pointer">
    <img 
      [alt]="event.title"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" 
      [src]="event.image"
    />
    <div class="absolute top-4 left-4 bg-primary text-secondary font-black px-4 py-2 rounded-lg text-center shadow-lg">
      <span class="block text-2xl leading-none">{{ event.day }}</span>
      <span class="block text-xs uppercase tracking-wider">{{ event.month }}</span>
    </div>
    <div class="absolute bottom-4 left-4">
      <span class="bg-secondary/90 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">
        {{ event.category }}
      </span>
    </div>
  </a>

  <!-- Content Section -->
  <div class="md:w-2/5 p-8 flex flex-col justify-center relative">
    <div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
      <span class="material-icons text-9xl text-gray-100 dark:text-gray-800">event</span>
    </div>
    <div class="relative z-10">
      <h3 class="text-3xl font-extrabold text-secondary dark:text-white mb-4 leading-tight">
        {{ event.title }}
      </h3>
      <div class="flex items-center text-gray-500 dark:text-gray-400 mb-6 text-sm">
        <span class="material-icons text-primary mr-2">location_on</span>
        {{ event.location }}
        <span class="mx-3 text-gray-300">|</span>
        <span class="material-icons text-primary mr-2">schedule</span>
        {{ event.date }}
      </div>
      <p class="text-gray-600 dark:text-gray-300 mb-8 leading-relaxed">
        {{ event.description }}
      </p>
      <button 
        [routerLink]="['/events', event.id]"
        class="w-full sm:w-auto bg-secondary hover:bg-secondary/90 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer"
      >
        Ver todos los detalles
        <span class="material-icons text-sm">arrow_forward</span>
      </button>
    </div>
  </div>
</div>
