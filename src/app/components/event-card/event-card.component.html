<div class="bg-white dark:bg-surface-dark rounded-xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 dark:border-gray-700 group flex flex-col overflow-hidden">
  <a 
    [routerLink]="['/events', event.id]"
    class="relative h-56 overflow-hidden block cursor-pointer"
  >
    <img 
      [alt]="event.title"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" 
      [src]="event.image"
    />
    <div class="absolute top-4 right-4 bg-primary text-secondary font-black px-3 py-2 rounded-lg text-center shadow-md min-w-[60px]">
      <span class="block text-xl leading-none font-extrabold">{{ event.day }}</span>
      <span class="block text-[10px] uppercase font-bold tracking-wider">{{ event.month }}</span>
    </div>
    <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-black/60 to-transparent"></div>
    <span class="absolute bottom-4 left-4 text-white text-xs font-bold px-2 py-1 bg-white/20 backdrop-blur-md rounded border border-white/30 uppercase tracking-wide">
      {{ event.category }}
    </span>
  </a>

  <div class="p-6 flex-1 flex flex-col">
    <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2 leading-tight group-hover:text-secondary dark:group-hover:text-primary transition-colors">
      {{ event.title }}
    </h3>
    <p class="text-gray-500 dark:text-gray-400 text-sm mb-4 line-clamp-3 flex-grow">
      {{ event.description }}
    </p>
    <div class="space-y-2 mb-4">
      <div class="flex items-center text-xs text-gray-600 dark:text-gray-300 font-medium">
        <span class="material-icons text-primary text-sm mr-2">schedule</span>
        {{ event.date }}
      </div>
      <div class="flex items-center text-xs text-gray-600 dark:text-gray-300 font-medium">
        <span class="material-icons text-primary text-sm mr-2">place</span>
        {{ event.location }}
      </div>
    </div>
    <a 
      [routerLink]="['/events', event.id]"
      class="inline-flex items-center justify-center w-full py-2.5 border-2 border-secondary text-secondary font-bold text-sm rounded-lg hover:bg-secondary hover:text-white transition-colors dark:border-gray-500 dark:text-gray-300 dark:hover:bg-primary dark:hover:text-secondary dark:hover:border-primary cursor-pointer" 
    >
      Ver detalles
    </a>
  </div>
</div>
