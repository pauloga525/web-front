<section class="py-12 sm:py-16 bg-white dark:bg-gray-800/50">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8">
    <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">
      <!-- News List -->
      <div class="lg:w-7/12">
        <div class="flex items-center gap-2 mb-6 sm:mb-8">
          <span class="material-icons text-secondary dark:text-primary">newspaper</span>
          <h2 class="text-xl sm:text-2xl font-bold text-secondary dark:text-white">Noticias Recientes</h2>
        </div>

        <div class="space-y-6 sm:space-y-8">
          @for (news of newsItems; track $index) {
            <div class="flex flex-col sm:flex-row gap-4 sm:gap-5 group cursor-pointer border-b border-gray-100 pb-6 sm:pb-8 last:border-b-0">
              <div class="flex-shrink-0 w-full sm:w-28 md:w-32 h-28 md:h-32 rounded-xl overflow-hidden bg-gray-200">
                <img 
                  [alt]="news.title"
                  class="w-full h-full object-cover transition-transform group-hover:scale-110" 
                  [src]="news.image"
                >
              </div>
              <div class="flex-1">
                <h3 class="text-lg sm:text-xl font-bold text-gray-900 dark:text-white mb-2 group-hover:text-secondary dark:group-hover:text-primary transition-colors">{{ news.title }}</h3>
                <div class="text-xs text-primary font-bold mb-2 sm:mb-3 uppercase tracking-wider">{{ news.category }}</div>
                <p class="text-xs sm:text-sm text-gray-600 dark:text-gray-300 leading-relaxed">{{ news.description }}</p>
              </div>
            </div>
          }
        </div>
      </div>

      <!-- Admissions Box -->
      <div class="lg:w-5/12">
        <div class="bg-secondary dark:bg-surface-dark rounded-2xl md:rounded-3xl p-6 sm:p-8 lg:p-12 relative overflow-hidden shadow-2xl flex flex-col justify-center">
          <div class="absolute -bottom-20 -right-20 w-64 h-64 bg-primary rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
          <div class="absolute -top-20 -left-20 w-64 h-64 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-10"></div>
          
          <div class="relative z-10 text-center">
            <div class="w-12 sm:w-16 h-12 sm:h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 sm:mb-6 backdrop-blur-sm">
              <span class="material-icons text-primary text-2xl sm:text-3xl">edit_document</span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-3 sm:mb-4">Admisiones Abiertas</h2>
            <p class="text-gray-300 mb-6 sm:mb-8 leading-relaxed text-sm sm:text-base">
              Formar parte de nuestra familia es el primer paso hacia un futuro lleno de oportunidades.
            </p>
            <button class="w-full bg-primary hover:bg-yellow-400 text-secondary font-black text-xs sm:text-sm uppercase tracking-wide py-3 sm:py-4 rounded-xl shadow-lg transition-transform transform active:scale-95 mb-4">
              Iniciar Proceso
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
