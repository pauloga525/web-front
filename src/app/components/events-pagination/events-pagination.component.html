<div class="flex justify-center items-center gap-2">
  <!-- Previous Button -->
  <button 
    class="w-10 h-10 rounded-lg flex items-center justify-center text-gray-500 hover:text-secondary hover:bg-gray-100 transition-colors disabled:opacity-50"
    [disabled]="currentPage === 1"
    (click)="previousPage()"
  >
    <span class="material-icons">chevron_left</span>
  </button>

  <!-- Page Numbers -->
  @for (page of pageNumbers; let i = $index; track i + '-' + page) {
    @if (page === -1) {
      <span class="text-gray-400 px-2">...</span>
    } @else {
      <button 
        [class]="page === currentPage 
          ? 'w-10 h-10 rounded-lg flex items-center justify-center bg-secondary text-white font-bold shadow-md transition-transform hover:-translate-y-0.5'
          : 'w-10 h-10 rounded-lg flex items-center justify-center text-gray-600 font-medium hover:bg-gray-100 transition-colors'"
        (click)="goToPage(page)"
      >
        {{ page }}
      </button>
    }
  }

  <!-- Next Button -->
  <button 
    class="w-10 h-10 rounded-lg flex items-center justify-center text-gray-500 hover:text-secondary hover:bg-gray-100 transition-colors disabled:opacity-50"
    [disabled]="currentPage === totalPages"
    (click)="nextPage()"
  >
    <span class="material-icons">chevron_right</span>
  </button>
</div>
