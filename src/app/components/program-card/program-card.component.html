<div class="group/card flex flex-col bg-white rounded-xl overflow-hidden shadow-[0_2px_8px_rgba(0,0,0,0.08)] hover:shadow-[0_8px_24px_rgba(0,0,0,0.12)] transition-all duration-300 border border-gray-100">
  <div class="relative w-full aspect-[4/3] overflow-hidden">
    <div class="card-image absolute inset-0 bg-cover bg-center transition-transform duration-500 ease-out" [style.background-image]="'url(' + program.image + ')'">
    </div>
    <div class="absolute top-2 sm:top-4 left-2 sm:left-4 bg-white/90 backdrop-blur text-xs font-bold px-2 sm:px-3 py-1 rounded-full text-primary uppercase tracking-wider shadow-sm">
      {{ program.faculty }}
    </div>
  </div>
  <div class="flex flex-col flex-grow p-4 sm:p-5 md:p-6">
    <h3 class="text-base sm:text-lg md:text-xl font-bold text-secondary mb-2 group-hover/card:text-primary transition-colors">
      {{ program.title }}
    </h3>
    <p class="text-gray-600 text-xs sm:text-sm mb-4 sm:mb-6 line-clamp-2">
      {{ program.description }}
    </p>
    <div class="mt-auto flex flex-col gap-3 sm:gap-4">
      <div class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm text-gray-600 flex-wrap">
        <div class="flex items-center gap-1 bg-gray-50 px-2 py-1 rounded-md">
          <span class="material-icons text-sm">schedule</span>
          <span>{{ program.duration }}</span>
        </div>
        <div class="flex items-center gap-1 bg-gray-50 px-2 py-1 rounded-md">
          <span class="material-icons text-sm">location_on</span>
          <span>{{ program.modality }}</span>
        </div>
      </div>
      <button 
        (click)="navigateToCareer(program.title)"
        class="w-full flex items-center justify-center gap-2 rounded-lg py-2 sm:py-2.5 px-3 sm:px-4 border-2 border-primary text-primary hover:bg-primary hover:text-white transition-all font-bold text-xs sm:text-sm group/btn cursor-pointer">
        <span>Ver Carrera</span>
        <span class="material-icons text-sm group-hover/btn:translate-x-1 transition-transform">arrow_forward</span>
      </button>
    </div>
  </div>
</div>
