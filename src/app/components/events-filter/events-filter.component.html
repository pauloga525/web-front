<div class="flex flex-col md:flex-row gap-4 justify-between items-center">
  <!-- Search Input -->
  <div class="relative w-full md:w-1/3">
    <span class="material-icons absolute left-3 top-3 text-gray-400">search</span>
    <input 
      class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-secondary focus:border-transparent outline-none transition-all" 
      placeholder="Buscar eventos por nombre..." 
      type="text"
      [(ngModel)]="filter.searchTerm"
      (change)="onFilterChange()"
    />
  </div>

  <!-- Filter Controls -->
  <div class="flex flex-wrap gap-3 w-full md:w-auto">
    <!-- Category Select -->
    <select 
      class="pl-4 pr-10 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:ring-2 focus:ring-secondary outline-none cursor-pointer"
      [(ngModel)]="filter.category"
      (change)="onFilterChange()"
    >
      @for (cat of categories; track cat.label) {
        <option [value]="cat.value">{{ cat.label }}</option>
      }
    </select>

    <!-- Month and Year Selects -->
    <div class="flex gap-4">
      <select 
        class="pl-4 pr-10 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:ring-2 focus:ring-secondary outline-none cursor-pointer"
        [(ngModel)]="filter.month"
        (change)="onFilterChange()"
      >
        @for (month of months; track month.label) {
          <option [value]="month.value">{{ month.label }}</option>
        }
      </select>
      <select 
        class="pl-4 pr-10 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:ring-2 focus:ring-secondary outline-none cursor-pointer"
        [(ngModel)]="filter.year"
        (change)="onFilterChange()"
      >
        @for (year of years; track year.label) {
          <option [value]="year.value">{{ year.label }}</option>
        }
      </select>
    </div>
  </div>
</div>
