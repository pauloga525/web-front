<div class="bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-20 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
    <div class="flex items-center gap-2">
      <button 
        (click)="goBack()" 
        class="inline-flex items-center gap-1 text-gray-700 dark:text-gray-300 hover:text-yellow-400 transition-colors font-medium text-sm hover:bg-transparent focus:bg-transparent active:bg-transparent"
      >
        <span class="material-icons text-lg">arrow_back</span>
        Volver
      </button>
      
      <div class="flex items-center gap-2 ml-4 border-l border-gray-300 dark:border-gray-600 pl-4">
        @for (breadcrumb of breadcrumbs; track breadcrumb.label) {
          <div class="flex items-center gap-2">
            @if ($index > 0) {
              <span class="text-gray-400 dark:text-gray-500">/</span>
            }
            @if (breadcrumb.path) {
              <a 
                [routerLink]="breadcrumb.path"
                class="text-gray-600 dark:text-gray-300 hover:text-yellow-400 transition-colors text-sm"
              >
                {{ breadcrumb.label }}
              </a>
            } @else {
              <span class="text-gray-600 dark:text-gray-300 text-sm font-medium">
                {{ breadcrumb.label }}
              </span>
            }
          </div>
        }
      </div>
    </div>
  </div>
</div>
