<section class="py-8 sm:py-12 bg-gray-50 border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8">
    <h2 class="text-center text-base sm:text-lg md:text-xl font-bold text-secondary uppercase tracking-widest mb-6 sm:mb-10">Nuestra Comunidad Salesiana</h2>

    <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 md:gap-8 lg:gap-10">
      @for (partner of partners; track $index) {
        <button
          type="button"
          (click)="open(partner)"
          class="flex flex-col items-center justify-center p-6 sm:p-8 bg-white rounded-lg shadow-md hover:shadow-xl border border-gray-100 transition-all duration-300 cursor-pointer hover:border-primary hover:scale-105 group"
        >
          <div class="w-20 sm:w-28 md:w-32 lg:w-40 h-20 sm:h-28 md:h-32 lg:h-40 flex items-center justify-center mb-3">
            <img
              [alt]="partner.name"
              class="max-w-full max-h-full object-contain mix-blend-multiply group-hover:brightness-110 transition-all duration-300"
              [src]="partner.logo"
            >
          </div>
          <p class="text-xs sm:text-sm text-center text-gray-600 font-medium group-hover:text-primary transition-colors duration-300">{{ partner.name }}</p>
        </button>
      }
    </div>
  </div>
</section>

@if (selected) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50" (click)="close()">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-6" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <div class="flex items-start justify-between mb-4">
        <div class="flex items-center gap-3 min-w-0">
          <img [src]="selected.logo" [alt]="selected.name" class="w-12 h-12 object-contain shrink-0" />
          <h3 class="font-bold text-secondary text-base leading-tight">{{ selected.name }}</h3>
        </div>
        <button type="button" (click)="close()" aria-label="Cerrar" class="text-gray-400 hover:text-gray-700 text-2xl leading-none px-1">&times;</button>
      </div>

      <div class="space-y-2">
        @for (s of selected.socials; track $index) {
          <a
            [href]="s.url"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center gap-3 p-3 rounded-xl border border-gray-100 hover:border-primary hover:bg-gray-50 transition-colors"
          >
            <span class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0"
              [style.background]="s.meta.color">{{ s.meta.label.charAt(0) }}</span>
            <span class="flex-1 min-w-0">
              <span class="block text-sm font-semibold text-gray-800">{{ s.meta.label }}</span>
              <span class="block text-xs text-gray-500">{{ s.meta.action }}</span>
            </span>
          </a>
        }
        @if (selected.url) {
          <a
            [href]="selected.url"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center justify-center p-2 text-xs text-gray-500 hover:text-primary transition-colors"
          >Visitar sitio web</a>
        }
      </div>
    </div>
  </div>
}
