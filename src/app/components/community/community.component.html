<section class="py-8 sm:py-12 bg-gray-50 border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8">
    <h2 class="text-center text-base sm:text-lg md:text-xl font-bold text-secondary uppercase tracking-widest mb-6 sm:mb-10">Nuestra Comunidad Salesiana</h2>

    <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 md:gap-8 lg:gap-10">
      @for (partner of partners; track $index) {
        <button
          type="button"
          (click)="open(partner)"
          class="flex flex-col items-center justify-center p-6 sm:p-8 bg-white rounded-lg shadow-md hover:shadow-xl border border-gray-100 transition-all duration-300 cursor-pointer hover:border-primary hover:scale-105 group"
        >
          <div class="w-20 sm:w-28 md:w-32 lg:w-40 h-20 sm:h-28 md:h-32 lg:h-40 flex items-center justify-center mb-3">
            <img
              [alt]="partner.name"
              class="max-w-full max-h-full object-contain mix-blend-multiply group-hover:brightness-110 transition-all duration-300"
              [src]="partner.logo"
            >
          </div>
          <p class="text-xs sm:text-sm text-center text-gray-600 font-medium group-hover:text-primary transition-colors duration-300">{{ partner.name }}</p>
        </button>
      }
    </div>
  </div>
</section>

@if (selected) {
  <div class="community-backdrop fixed inset-0 z-[100] flex items-center justify-center p-4 bg-secondary/60 backdrop-blur-sm" (click)="close()">
    <div class="community-modal relative w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden" role="dialog" aria-modal="true" [attr.aria-label]="selected.name" (click)="$event.stopPropagation()">

      <!-- Cabecera -->
      <div class="relative bg-gradient-to-br from-secondary to-secondary/80 px-6 pt-8 pb-14 text-center">
        <button type="button" (click)="close()" aria-label="Cerrar"
          class="absolute top-3 right-3 w-9 h-9 flex items-center justify-center rounded-full text-white/70 hover:text-white hover:bg-white/15 transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <p class="text-[11px] uppercase tracking-[0.2em] text-white/60 font-semibold">Comunidad Salesiana</p>
        <h3 class="mt-1 text-xl font-extrabold text-white leading-tight">{{ selected.name }}</h3>
      </div>

      <!-- Logo superpuesto -->
      <div class="relative -mt-10 flex justify-center">
        <div class="w-20 h-20 rounded-full bg-white shadow-lg ring-4 ring-white flex items-center justify-center p-2">
          <img [src]="selected.logo" [alt]="selected.name" class="max-w-full max-h-full object-contain" />
        </div>
      </div>

      <!-- Redes -->
      <div class="px-6 pt-4 pb-6">
        <p class="text-center text-sm text-gray-500 mb-4">Síguenos y conoce más en:</p>
        <div class="space-y-3 max-h-[50vh] overflow-y-auto pr-1">
          @for (s of selected.socials; track $index) {
            <a
              [href]="s.url"
              target="_blank"
              rel="noopener noreferrer"
              class="social-row group flex items-center gap-4 p-3 rounded-2xl border border-gray-100 bg-gray-50/60 hover:bg-white hover:border-transparent hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200"
            >
              <span class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 shadow-md group-hover:scale-110 transition-transform duration-200"
                [style.background]="s.meta.color">
                <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path [attr.d]="s.meta.path"/></svg>
              </span>
              <span class="flex-1 min-w-0">
                <span class="block text-sm font-bold text-gray-800">{{ s.meta.label }}</span>
                <span class="block text-xs text-gray-500 truncate">{{ s.meta.action }}</span>
              </span>
              <svg class="w-5 h-5 text-gray-300 group-hover:text-primary group-hover:translate-x-1 transition-all duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
            </a>
          }
        </div>
      </div>
    </div>
  </div>
}
