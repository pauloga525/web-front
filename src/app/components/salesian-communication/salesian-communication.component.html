<section class="py-12 bg-secondary text-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
      <div class="lg:col-span-5">
        <h2 class="text-3xl font-extrabold uppercase tracking-wide mb-4">Comunicación Salesiana</h2>
        <p class="text-gray-300 text-sm leading-relaxed max-w-lg mb-6">
          Mantente informado con las últimas noticias de la inspectoría, recursos multimedia y boletines oficiales de nuestra comunidad.
        </p>
      </div>

      <div class="lg:col-span-7 w-full">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
          @for (resource of resources; track $index) {
            <a
              class="group flex items-center justify-start py-3 border-b border-primary/30 hover:border-primary transition-colors duration-300"
              [href]="resource.href"
              target="_blank"
              rel="noopener noreferrer"
            >
              <div class="flex items-center gap-3 w-full">
                @if (resource.imagen) {
                  <div class="bg-primary/20 rounded-full p-2 flex items-center justify-center group-hover:bg-primary transition-colors w-16 h-16 shrink-0">
                    <img [src]="resource.imagen" [alt]="resource.title" class="w-11 h-11 object-contain" />
                  </div>
                } @else {
                  <div class="bg-primary/20 rounded-full p-2 flex items-center justify-center group-hover:bg-primary transition-colors">
                    <span class="material-icons text-primary text-sm group-hover:text-secondary transition-colors">{{ resource.icon }}</span>
                  </div>
                }
                <span class="font-bold text-white text-lg group-hover:text-primary transition-colors">{{ resource.title }}</span>
              </div>
            </a>
          }
        </div>
      </div>
    </div>
  </div>
</section>
