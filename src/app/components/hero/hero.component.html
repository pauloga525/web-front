<div class="relative bg-secondary dark:bg-gray-900 overflow-hidden">
  <div class="absolute inset-0">
    @if (hero.imagen_fallback) {
      @if (isVideoUrl(hero.imagen_fallback)) {
        <video autoplay muted loop playsinline class="w-full h-full object-cover object-center">
          <source [src]="hero.imagen_fallback" [type]="hero.imagen_fallback.endsWith('.webm') ? 'video/webm' : 'video/mp4'">
          <track kind="captions" srclang="es" label="Español" src="data:text/vtt,WEBVTT" default>
        </video>
      } @else {
        <img
          alt="Fondo hero"
          class="w-full h-full object-cover object-center"
          [src]="hero.imagen_fallback"
        >
      }
    }
    <div class="absolute inset-0 bg-gradient-to-r from-gray-900/90 via-gray-900/60 to-transparent"></div>
    <div class="absolute inset-0 bg-secondary/30 mix-blend-multiply"></div>
  </div>

  <div class="relative max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 py-16 sm:py-24 lg:py-40">
    <div class="lg:w-2/3">

      @if (hero.etiqueta) {
        <span class="inline-block bg-primary/20 border border-primary/40 text-primary font-semibold text-xs sm:text-sm px-3 py-1 rounded-full mb-4 tracking-wide">
          {{ hero.etiqueta }}
        </span>
      }

      <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-extrabold text-white leading-tight mb-4 sm:mb-6">
        {{ hero.titulo }}
        @if (hero.textoDestacado) {
          <br><span class="text-primary italic">{{ hero.textoDestacado }}</span>
        }
      </h1>

      <p class="text-base sm:text-lg md:text-xl text-gray-200 mb-6 sm:mb-10 max-w-2xl font-light">
        {{ hero.descripcion }}
      </p>

      <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
        <a 
          *ngFor="let boton of hero.botones"
          class="font-bold px-6 sm:px-8 py-3 sm:py-4 rounded-full text-center transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2 group text-sm sm:text-base"
          [ngClass]="{
            'bg-primary hover:bg-yellow-400 text-secondary': boton.estilo === 'primary',
            'bg-white/10 hover:bg-white/20 backdrop-blur-sm border border-white/30 text-white': boton.estilo === 'secondary'
          }"
          [href]="boton.ruta"
          [routerLink]="boton.ruta !== '#' ? boton.ruta : null"
        >
          {{ boton.texto }}
          <span class="material-icons text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
        </a>
      </div>
    </div>
  </div>
</div>
