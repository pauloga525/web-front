<div class="sticky top-[73px] z-40 w-full border-b border-gray-200 bg-white/95 backdrop-blur-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
        <div class="flex items-center gap-2 text-gray-600 mr-2">
          <span class="material-icons">filter_list</span>
          <span class="font-medium text-sm uppercase tracking-wide">Filtros</span>
        </div>
        <select 
          [(ngModel)]="filters.faculty"
          (change)="onFilterChange()"
          class="h-10 px-4 pr-10 rounded-lg bg-gray-50 border border-gray-200 text-gray-700 text-sm font-medium focus:ring-2 focus:ring-primary focus:border-primary cursor-pointer hover:bg-gray-100 transition-colors">
          @for (faculty of faculties; track $index) {
            <option [value]="faculty">{{ faculty }}</option>
          }
        </select>
        <select 
          [(ngModel)]="filters.modality"
          (change)="onFilterChange()"
          class="h-10 px-4 pr-10 rounded-lg bg-gray-50 border border-gray-200 text-gray-700 text-sm font-medium focus:ring-2 focus:ring-primary focus:border-primary cursor-pointer hover:bg-gray-100 transition-colors">
          @for (modality of modalities; track $index) {
            <option [value]="modality">{{ modality }}</option>
          }
        </select>
        <select 
          [(ngModel)]="filters.duration"
          (change)="onFilterChange()"
          class="h-10 px-4 pr-10 rounded-lg bg-gray-50 border border-gray-200 text-gray-700 text-sm font-medium focus:ring-2 focus:ring-primary focus:border-primary cursor-pointer hover:bg-gray-100 transition-colors">
          @for (duration of durations; track $index) {
            <option [value]="duration">{{ duration }}</option>
          }
        </select>
      </div>
    </div>
  </div>
</div>
