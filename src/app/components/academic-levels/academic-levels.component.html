<section class="py-12 sm:py-16 md:py-20 bg-gray-50 dark:bg-background-dark">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 sm:mb-12 gap-4 sm:gap-6">
      <div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-secondary dark:text-white mb-2 relative inline-block">
          Niveles Académicos
          <div class="absolute -bottom-2 left-0 w-16 h-1 bg-primary rounded-full"></div>
        </h2>
      </div>
      <p class="text-gray-600 dark:text-gray-400 max-w-lg text-xs sm:text-sm md:text-right">
        Ofrecemos una educación continua y coherente desde los primeros años hasta la preparación universitaria.
      </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 sm:gap-5 md:gap-6">
      @for (level of levels; track level.name) {
        <div 
          [routerLink]="level.route"
          class="group relative rounded-2xl overflow-hidden aspect-[2/3] shadow-lg hover:shadow-2xl transition-all duration-300 cursor-pointer hover:scale-125">
          <img 
            [alt]="level.name"
            class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" 
            [src]="level.image"
          >
          <div class="absolute inset-0 bg-gradient-to-t from-secondary/90 via-transparent to-transparent group-hover:from-secondary opacity-100 transition-all duration-300"></div>
          
          <div class="absolute bottom-0 left-0 p-4 sm:p-5 md:p-6 w-full transform transition-all duration-300 group-hover:translate-y-0">
            <h3 class="text-base sm:text-lg md:text-xl font-bold text-white mb-1">{{ level.name }}</h3>
            <p class="text-gray-300 text-xs mb-3 line-clamp-2">{{ level.description }}</p>
            <div
              class="w-full py-2 bg-white/20 hover:bg-white/30 backdrop-blur-md text-white text-xs sm:text-sm font-semibold rounded-lg transition-colors border border-white/20 block text-center cursor-pointer"
            >
              Ver Programa
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
